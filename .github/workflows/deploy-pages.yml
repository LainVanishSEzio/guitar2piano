name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动点一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 仓库名为 <用户名>.github.io 时部署在根路径，无需 basePath；
      # 其他仓库名部署在 /<仓库名>/ 下，必须设置 basePath，否则 JS/CSS 404。
      - name: 计算 basePath
        id: base
        shell: bash
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "$OWNER.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: 静态构建
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}

      # GitHub Pages 默认跑 Jekyll，会忽略 _next 这类下划线开头的目录，必须加 .nojekyll
      - name: 生成 .nojekyll
        run: touch out/.nojekyll

      - name: 发布到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
